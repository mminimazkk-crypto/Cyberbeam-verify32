[build]
  command = "echo 'Cyber Beam static site: no build step required'"
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NPM_FLAGS = "--ignore-scripts"
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200